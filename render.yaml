services:
  - type: worker
    name: telegram-lottery-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: telegram-lottery-db
          property: connectionString
      - key: CURRENCY
        value: ETB
      - key: LOTTERY_ID
        value: main
databases:
  - name: telegram-lottery-db
    databaseName: telegram_lottery
    user: telegram_lottery_user
    plan: basic-256mb
